# keyd configuration for tap-Super -> DMS launcher
# Tap Super alone  -> sends Super+Space (niri: Mod+Space -> open launcher)
# Hold Super + key -> normal Super combos, unaffected
#
# Install:
#   sudo apt install keyd
#   sudo install -D -m 644 ~/keyd-default.conf /etc/keyd/default.conf
#   sudo systemctl restart keyd
#   ⚠️ 必须 restart：apt 首次安装时服务会自动先启动（此时还没有本配置），
#      仅 `enable --now` 不会重启已运行的服务，配置将不会被加载。
# Revert anytime:
#   sudo systemctl disable --now keyd

[ids]
*

[global]
# 按住超过 300ms 再松开不触发"轻点"（防止 Win+鼠标拖窗口/点击后误弹启动器）
overload_tap_timeout = 300

[main]
leftmeta = overload(meta, macro(leftmeta+space))
rightmeta = overload(meta, macro(leftmeta+space))
